name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Hygiene checks (dead code, duplication, deps)
        run: pnpm check:all

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

  # Obsidian's directory scan installs dependencies the way
  # obsidianmd/obsidian-workflows src/deps.ts does: with pnpm-lock.yaml present
  # it runs `pnpm install --frozen-lockfile` on whatever pnpm the runner has. If
  # the install fails, the scan skips every dependency check and rejects the
  # release. 1.38.11 was rejected this way: pnpm >=11 ignores package.json's
  # `pnpm.overrides`, so the lockfile's overrides stopped matching
  # (diagrammo/diagrammo#1079). The scanner's pnpm version is not published, so
  # every major that can read a v9 lockfile is checked.
  frozen-install-like-obsidian-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pnpm: ['9', '10', '11', '12']
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm ${{ matrix.pnpm }}
        uses: pnpm/action-setup@v5
        with:
          version: ${{ matrix.pnpm }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: pnpm install --frozen-lockfile
        run: |
          pnpm --version
          pnpm install --frozen-lockfile

  # Fallback path of the same scan: with no pnpm on the runner it runs a
  # lockfile-free `npm install`. npm 10 (Node 22's bundled npm) crashes on the
  # vitest → vite → @vitejs/devtools → vitest peer cycle unless `overrides.vite`
  # pins it (diagrammo/diagrammo#1063).
  npm-install-like-obsidian-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 22 (bundles npm 10)
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: npm install with no lockfile and no pnpm
        run: |
          npm --version
          test ! -e package-lock.json
          # PATH cut to node + coreutils so a postinstall that calls pnpm fails here too
          PATH="$(dirname "$(command -v node)"):/usr/bin:/bin" npm install --no-audit --no-fund
